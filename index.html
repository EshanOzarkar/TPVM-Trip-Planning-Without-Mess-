<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPVM – Trip Planning Without Mess</title>
<meta name="description" content="Plan the whole trip on one map: how to get there, where to stay, eat and shop, with distances, times and all-in price estimates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/styles.css?v=31">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="url(#g)"/><path d="M9 22c0-4 3-3 5-6s0-6 3-6 4 2 6 2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4.5"/><circle cx="9" cy="22.5" r="2.6" fill="#fff"/><path d="M23 6.5a3.6 3.6 0 0 1 3.6 3.6c0 2.9-3.6 6.4-3.6 6.4s-3.6-3.5-3.6-6.4A3.6 3.6 0 0 1 23 6.5z" fill="#fbbf24"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#14b8a6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs></svg></span>
    <div><b>TPVM</b><small>Trip Planning Without Mess</small></div>
  </div>
  <form id="tripForm" class="tripform" autocomplete="off">
    <div class="field ac"><label for="fromInput">From</label>
      <input id="fromInput" placeholder="Origin city" required><ul class="sugg" id="fromSugg"></ul></div>
    <div class="field ac"><label for="toInput">To</label>
      <input id="toInput" placeholder="Destination" required><ul class="sugg" id="toSugg"></ul></div>
    <div class="field"><label for="startDate">Check-in</label><input type="date" id="startDate"></div>
    <div class="field"><label for="endDate">Check-out</label><input type="date" id="endDate"></div>
    <div class="field sm"><label for="travelers">Travellers</label><input type="number" id="travelers" min="1" max="20" value="2"></div>
    <div class="field sm"><label for="tier">Style</label>
      <select id="tier"><option value="0.6">Budget</option><option value="1" selected>Comfort</option><option value="2">Premium</option></select></div>
    <button class="btn primary" id="planBtn" type="submit">Plan trip</button>
  </form>
</header>

<main class="layout">
  <aside class="panel">
    <div class="gsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="gsearch" type="search" placeholder="Live search: places, food, hotels, sights, tips…" autocomplete="off" aria-label="Live search">
      <button id="gclear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="content" class="content"></div>
  </aside>
  <section class="mapwrap">
    <div id="map"></div>
    <div class="hud" id="hud"></div>
    <div class="mapctl">
      <button id="btn3d" type="button" title="Tilt the map to see 3D buildings">3D</button>
      <button id="btnStyle" type="button" title="Change the map style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5"/></svg><span id="styleName">Detailed</span></button>
    </div>
    <div class="layerbar" id="layerbar"></div>
    <div class="toast" id="toast" role="status"></div>
  </section>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/config.js?v=31"></script>
<script src="js/api.js?v=31"></script>
<script src="js/app.js?v=31"></script>
<script src="js/assistant.js?v=31"></script>
</body>
</html>
